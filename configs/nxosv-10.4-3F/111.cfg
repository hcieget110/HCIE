! PNETLab NX-OSv 10.4(3)F skeleton; lab validation pending
! Paste in configure terminal; confirm interface mapping first
hostname NX-111
feature ospf
feature bgp
feature interface-vlan
feature vn-segment-vlan-based
feature nv overlay
nv overlay evpn
fabric forwarding anycast-gateway-mac 0000.2222.3333

vlan 100
  name APP100
  vn-segment 10100
vlan 200
  name APP200
  vn-segment 10200
vlan 3000
  name L3VNI-TENANT-A
  vn-segment 50000

vrf context TENANT-A
  vni 50000
  rd auto
  address-family ipv4 unicast
    route-target both 65000:50000
    route-target both 65000:50000 evpn

router ospf UNDERLAY
  router-id 10.255.0.111

interface loopback0
  description BGP-ROUTER-ID
  ip address 10.255.0.111/32
  ip router ospf UNDERLAY area 0.0.0.0

interface loopback1
  description VTEP-SOURCE
  ip address 10.255.1.111/32
  ip router ospf UNDERLAY area 0.0.0.0

interface Ethernet1/1
  description UNDERLAY-TO-222
  no switchport
  mtu 9216
  ip address 10.0.12.1/30
  ip ospf network point-to-point
  ip router ospf UNDERLAY area 0.0.0.0
  no shutdown

interface Ethernet1/2
  description UNDERLAY-TO-333
  no switchport
  mtu 9216
  ip address 10.0.13.1/30
  ip ospf network point-to-point
  ip router ospf UNDERLAY area 0.0.0.0
  no shutdown

interface Ethernet1/3
  description HOST-VLAN100
  switchport
  switchport mode access
  switchport access vlan 100
  spanning-tree port type edge
  no shutdown

interface Ethernet1/4
  description HOST-VLAN200
  switchport
  switchport mode access
  switchport access vlan 200
  spanning-tree port type edge
  no shutdown

interface Vlan100
  no shutdown
  vrf member TENANT-A
  ip address 192.168.100.1/24
  fabric forwarding mode anycast-gateway

interface Vlan200
  no shutdown
  vrf member TENANT-A
  ip address 192.168.200.1/24
  fabric forwarding mode anycast-gateway

interface Vlan3000
  no shutdown
  vrf member TENANT-A
  ip forward

interface nve1
  no shutdown
  host-reachability protocol bgp
  source-interface loopback1
  member vni 10100
    ingress-replication protocol bgp
  member vni 10200
    ingress-replication protocol bgp
  member vni 50000 associate-vrf

evpn
  vni 10100 l2
    rd auto
    route-target import 65000:10100
    route-target export 65000:10100
  vni 10200 l2
    rd auto
    route-target import 65000:10200
    route-target export 65000:10200

router bgp 65000
  router-id 10.255.0.111
  address-family l2vpn evpn
  neighbor 10.255.0.222
    remote-as 65000
    update-source loopback0
    address-family l2vpn evpn
      send-community
      send-community extended
  neighbor 10.255.0.33
    remote-as 65000
    update-source loopback0
    address-family l2vpn evpn
      send-community
      send-community extended
